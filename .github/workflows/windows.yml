name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The Giac worker, the computer algebra system behind Solve. It is built
  # with MSYS2's clang from GeoGebra's mirror of Giac, and kept in the cache
  # until the pinned commit or the worker's own files change.
  giac:
    runs-on: windows-latest
    env:
      GIAC_COMMIT: 19a710aea9d528afa272ea582f3283f242e17af3
    steps:
      - uses: actions/checkout@v4

      - name: Cache the Giac worker
        id: cache
        uses: actions/cache@v4
        with:
          path: giac-build/giac-worker.exe
          key: giac-worker-${{ env.GIAC_COMMIT }}-${{ hashFiles('giac/CMakeLists.txt', 'giac/worker.cc') }}

      - name: Check out Giac
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: geogebra/giac
          ref: ${{ env.GIAC_COMMIT }}
          path: giac-src

      - name: Set up MSYS2
        if: steps.cache.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: false
          install: >-
            mingw-w64-clang-x86_64-cc
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja

      - name: Build the Giac worker
        if: steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          cmake -S giac -B giac-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DGIAC_SRC="$(cygpath -m "$PWD/giac-src")"
          cmake --build giac-build

      - name: Try the worker
        shell: pwsh
        run: |
          "giac-worker.exe is {0:N1} MB" -f ((Get-Item ./giac-build/giac-worker.exe).Length / 1MB)
          Get-Content giac/smoke.txt | ./giac-build/giac-worker.exe

      - name: Upload the worker
        uses: actions/upload-artifact@v4
        with:
          name: giac-worker
          path: giac-build/giac-worker.exe

  build:
    runs-on: windows-latest
    needs: giac
    env:
      GIAC_WORKER: ${{ github.workspace }}\giac-build\giac-worker.exe
    steps:
      - uses: actions/checkout@v4

      - name: Get the Giac worker
        uses: actions/download-artifact@v4
        with:
          name: giac-worker
          path: giac-build

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run tests
        run: cargo test --workspace

      - name: Solve with Giac
        # The same Solve the app runs, with the real worker: answers come
        # back, read correctly and pass their numeric checks.
        env:
          GRAPHCALC_GIAC: ${{ github.workspace }}\giac-build\giac-worker.exe
        run: cargo test -p app giac_answers -- --nocapture

      - name: Build release exe
        run: cargo build --release -p app

      - name: Offscreen render check
        # Runners have no GPU, so this exercises wgpu's software fallback (WARP).
        # graphcalc.exe is a GUI-subsystem app, so PowerShell does not wait for
        # it or set $LASTEXITCODE; Start-Process -Wait gives the real exit code.
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./target/release/graphcalc.exe `
            -ArgumentList '--render-png','render.png','1200x800','a=2','"y=a\sin\left(x\right)"','x=y^2','"y=\frac{1}{x}"','x^2+y^2=25','y>x^2','r=\theta','"\left(5\cos t,3\sin t\right)"','"\left[\left(n,n\right)\operatorname{for}n=\left[1...5\right]\right]"','"y=\int_{0}^{x}\sin\left(t^2\right)dt"','"y=\frac{d}{dx}\left|x\right|^3"','--select=1','--hover=1.5708,2' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput render.txt
          Get-Content render.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Graph block render
        # A document's graph block, drawn the way the page asks for it.
        shell: pwsh
        run: |
          '{"rows":[{"latex":"a=2"},{"latex":"y=a\\sin\\left(x\\right)"},{"latex":"y=x^2-3"}],"view":{"x":1,"y":0,"w":16},"width":1200,"height":640,"scale":2}' | Set-Content block.json
          $p = Start-Process -FilePath ./target/release/graphcalc.exe `
            -ArgumentList '--graph-block' -RedirectStandardInput block.json `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput block.txt
          if ($p.ExitCode -ne 0) { Get-Content block.txt; exit 1 }
          $url = (Get-Content block.txt -Raw).Trim()
          if (-not $url.StartsWith('data:image/png;base64,')) { "unexpected: $($url.Substring(0, [Math]::Min(200, $url.Length)))"; exit 1 }
          [IO.File]::WriteAllBytes("$PWD/block.png", [Convert]::FromBase64String($url.Substring(22)))
          "block.png is {0:N0} bytes" -f (Get-Item block.png).Length

      - name: Slider benchmark
        # Simulates dragging a slider that nine curves depend on. On the
        # software adapter only the app's own per-frame work is judged.
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./target/release/graphcalc.exe `
            -ArgumentList '--bench','1600x1000','600' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput bench.txt
          Get-Content bench.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Implicit benchmark
        # Eleven implicit and shaded relations, alone and all at once, then a
        # slider every one of them depends on. Judged the same way as above.
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./target/release/graphcalc.exe `
            -ArgumentList '--bench-implicit','1600x1000','120' `
            -Wait -PassThru -NoNewWindow -RedirectStandardOutput bench-implicit.txt
          Get-Content bench-implicit.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Window smoke test
        # Opens the real window, adds a slider through the panel and plays it,
        # screenshots the desktop while it runs, and fails unless the panel
        # reached the engine and curves were drawn.
        shell: pwsh
        run: |
          $p = Start-Process -FilePath ./target/release/graphcalc.exe `
            -ArgumentList '--smoke-test','20','smoke.txt' -PassThru
          Start-Sleep -Seconds 14
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("$PWD/window.png")
          $p.WaitForExit()
          Get-Content smoke.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Report exe size
        shell: pwsh
        run: '"graphcalc.exe is {0:N1} MB" -f ((Get-Item ./target/release/graphcalc.exe).Length / 1MB)'

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: graphcalc-windows
          path: target/release/graphcalc.exe

      - name: Upload test images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-images
          path: |
            render.png
            block.png
            window.png
            smoke.txt
            bench.txt
            bench-implicit.txt
          if-no-files-found: ignore
