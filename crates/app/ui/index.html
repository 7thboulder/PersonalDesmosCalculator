<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Expressions</title>
<style>{{MATHQUILL_CSS}}</style>
<style>{{STYLE}}</style>
</head>
<body>
<div id="panel">
  <div id="topbar">
    <button id="menu" class="icon" title="Graph menu">&#x2630;</button>
    <button id="add" class="icon" title="Add item">+</button>
    <span class="spacer"></span>
    <button class="icon" title="Undo (coming later)" disabled>&#x21B6;</button>
    <button class="icon" title="Redo (coming later)" disabled>&#x21B7;</button>
    <button class="icon" title="Settings (coming later)" disabled>&#x2699;</button>
  </div>
  <div id="list"></div>
  <div id="status">
    <div id="engine">Starting graph engine&hellip;</div>
    <div id="frame"></div>
  </div>
</div>
<div id="file-menu">
  <button data-file="new">New graph</button>
  <button data-file="open">Open&hellip;<span class="key">Ctrl+O</span></button>
  <button data-file="save">Save<span class="key">Ctrl+S</span></button>
  <button data-file="saveAs">Save as&hellip;<span class="key">Ctrl+Shift+S</span></button>
</div>
<div id="add-menu">
  <button data-add="expression"><span class="glyph">/x</span> expression</button>
  <button data-add="table"><span class="glyph">&#x229E;</span> table</button>
  <button data-add="ticker"><span class="glyph">&#x23F1;</span> ticker</button>
</div>
<div id="style-menu">
  <div class="colors"></div>
  <div class="line-options">
  <div class="styles">
    <button data-style="solid" title="Solid"><svg viewBox="0 0 40 10"><line x1="2" y1="5" x2="38" y2="5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></button>
    <button data-style="dashed" title="Dashed"><svg viewBox="0 0 40 10"><line x1="2" y1="5" x2="38" y2="5" stroke="currentColor" stroke-width="3" stroke-dasharray="8 5"/></svg></button>
    <button data-style="dotted" title="Dotted"><svg viewBox="0 0 40 10"><line x1="3" y1="5" x2="38" y2="5" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-dasharray="0.1 6"/></svg></button>
  </div>
  <label>Thickness <input class="width" type="range" min="0.5" max="10" step="0.5"></label>
  </div>
  <div class="point-options">
  <div class="styles">
    <button data-point="filled" title="Point"><svg viewBox="0 0 40 10"><circle cx="20" cy="5" r="4" fill="currentColor"/></svg></button>
    <button data-point="open" title="Open point"><svg viewBox="0 0 40 10"><circle cx="20" cy="5" r="3.2" fill="#fff" stroke="currentColor" stroke-width="1.6"/></svg></button>
    <button data-point="cross" title="Cross"><svg viewBox="0 0 40 10"><path d="M16.5 1.5l7 7M23.5 1.5l-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </div>
  <label>Point size <input class="point-size" type="range" min="2" max="20" step="1"></label>
  </div>
  <div class="toggles">
    <label class="toggle"><input type="checkbox" class="dots"> Points</label>
    <label class="toggle"><input type="checkbox" class="connect"> Lines</label>
  </div>
  <label>Opacity <input class="opacity" type="range" min="0" max="1" step="0.05"></label>
  <label class="fill-options">Fill <input class="fill-opacity" type="range" min="0" max="1" step="0.05"></label>
</div>
<script>{{JQUERY}}</script>
<script>{{MATHQUILL_JS}}</script>
<script>{{SCRIPT}}</script>
</body>
</html>
