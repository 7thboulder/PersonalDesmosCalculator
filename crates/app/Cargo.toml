[package]
name = "app"
description = "The calculator window: native wgpu graph plus the MathQuill expression panel."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
# Placeholder name until the app has a real one.
name = "graphcalc"
path = "src/main.rs"

[dependencies]
graph-core.workspace = true
graph-render.workspace = true
graph-expr.workspace = true
wgpu.workspace = true
png = "0.18"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
winit = "0.30"
wry = "0.57"
# Fetches a pasted desmos.com link; native-tls uses Windows's own TLS
# (SChannel), so nothing extra ships or needs installing.
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Controls_Dialogs"] }
